# Authoritative metric catalog. version 1.1.0
version: 1
metrics:
  - id: "CC-001"
    sector: "clean_code"
    name: "Naming conventions"
    description: "Names follow the language convention."
    criticality: "medium"
    verifies: "Identifiers use the conventional form for their language."
    calculation: "Count of public identifiers that break snake_case, camelCase, or PascalCase rules."
    result_range: "integer >= 0"
    red_line:
      operator: "max"
      value: 0
    evaluation_method: "Static symbol names from language adapters."
    recommended_tools:
      - "cqa-builtin"
      - "ruff"
      - "eslint"
      - "radon"
      - "clang-tidy"
    units: "count"
    direction: "lower_is_better"
    applicability: "Applicable when at least one supported source file is in scope."
